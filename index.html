<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💌 Chúc Mừng 20/10 – Dành cho Pé Dâu 🍓</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-gradient-to-br from-pink-100 via-rose-50 to-white flex justify-center items-center h-screen overflow-hidden">

  <div id="gift-scene" class="relative flex justify-center items-center">
    <!-- Vầng sáng -->
    <div class="glow"></div>

    <!-- Hộp quà -->
    <div class="gift-box">
      <div class="lid"></div>
      <div class="ribbon-vertical"></div>
      <div class="ribbon-horizontal"></div>
    </div>

    <!-- Phong bì -->
    <div class="envelope hidden opacity-0 absolute flex flex-col justify-center items-center">
      <div class="envelope-body">
        <div class="flap"></div>
      </div>
      <p class="mt-2 text-pink-500 font-medium text-sm animate-pulse">💌 Bấm để mở thư 💌</p>
    </div>

    <!-- Lá thư -->
    <div class="letter hidden opacity-0 absolute bg-white rounded-2xl shadow-2xl p-6 text-center border border-rose-200 max-w-xs">
      <h2 class="text-pink-600 font-semibold text-lg mb-3">Gửi đến Pé Dâu 🍓</h2>
      <p class="text-rose-500 leading-relaxed">
        Nhân ngày 20/10,<br>
        Xoài chúc Pé luôn tươi tắn như đóa hoa hồng 🌸,<br>
        ngọt ngào như trái dâu 🍓,<br>
        và hạnh phúc như chính nụ cười của Pé 💖<br>
        Thương Pé nhiều lắm 😘
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
